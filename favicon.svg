<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Favicon matching images/LOGOLOGO: chrome coupe over a gold ground line on a
    dark tile. The photographic logo cannot just be downscaled - its car is a
    thin chrome OUTLINE and only ~2.5% of the tile's pixels sit above
    mid-luminance, so a 16x16 resample averages it into a dark smudge.

    The roofline below is TRACED from the source (topmost bright pixel per
    column, simplified and smoothed), not hand-drawn, so it keeps the real
    shape: long raked nose, cabin peak forward of centre, fastback tail. The
    car is then stretched vertically about its own centre, because at true
    proportions it is 4:1 and would vanish again at 16px.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2d31"/>
      <stop offset=".55" stop-color="#131417"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="chrome" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="0" y2="46">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#e2e6ea"/>
      <stop offset="1" stop-color="#8b929b"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="5" y1="0" x2="59" y2="0">
      <stop offset="0" stop-color="#7d5f1c"/>
      <stop offset=".5" stop-color="#ffd978"/>
      <stop offset="1" stop-color="#7d5f1c"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="13" fill="url(#bg)"/>
  <path d="M64 0v28L24 64H0V54L54 0z" fill="#ffffff" opacity=".03"/>
  <rect x=".6" y=".6" width="62.8" height="62.8" rx="12.4" fill="none"
        stroke="#5c626b" stroke-opacity=".5" stroke-width="1.2"/>

  <!-- roofline, traced -->
  <path d="M5 26.04 C5.50 25.90 7.01 25.59 8.02 25.20 C9.03 24.81 10.04 24.31 11.05 23.71 C12.06 23.11 13.06 22.31 14.07 21.58 C15.08 20.85 16.09 20.03 17.10 19.31 C18.11 18.59 19.11 17.83 20.12 17.23 C21.13 16.63 22.13 16.07 23.14 15.70 C24.15 15.33 25.16 15.13 26.17 15.03 C27.18 14.93 28.18 14.95 29.19 15.10 C30.20 15.25 31.21 15.47 32.22 15.92 C33.23 16.36 34.23 16.97 35.24 17.77 C36.25 18.57 37.25 19.77 38.26 20.73 C39.27 21.69 40.28 22.85 41.29 23.52 C42.30 24.19 43.30 24.48 44.31 24.76 C45.32 25.04 46.33 25.02 47.34 25.22 C48.35 25.41 49.35 25.63 50.36 25.93 C51.37 26.23 52.37 26.49 53.38 27.00 C54.39 27.51 55.47 28.12 56.41 29.00 C57.35 29.88 58.57 31.73 59.00 32.27" fill="none" stroke="url(#chrome)" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sill running the length of the car, arcing up over each wheel -->
  <path d="M5.4 37.82 L10.96 37.82 M19.56 37.82 L39.58 37.82 M48.18 37.82 L58.6 37.82"
        fill="none" stroke="url(#chrome)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- wheel arches: inverted U standing on the ground line, as in the source -->
  <path d="M10.96 43.02 L10.96 37.82 A4.3 4.3 0 0 1 19.56 37.82 L19.56 43.02 M39.58 43.02 L39.58 37.82 A4.3 4.3 0 0 1 48.18 37.82 L48.18 43.02"
        fill="none" stroke="url(#chrome)" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- gold ground line -->
  <path d="M6 43.02 L58 43.02" stroke="url(#gold)" stroke-width="1.9" stroke-linecap="round"/>
</svg>
